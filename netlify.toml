[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Keep the same /api/... URLs the site already calls
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

[[redirects]]
  from = "/manage"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/manage"
  status = 302
